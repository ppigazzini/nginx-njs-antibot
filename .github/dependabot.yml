version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A release is proposed once it is 7 days old, so one that is pulled or
    # retagged in its first week is never picked up.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
  # The site's toolchain in uv.lock. pyproject.toml holds the same 7-day wait
  # for a lock made by hand.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docs:
        patterns:
          - "*"
    commit-message:
      prefix: docs
