name: build

# Compiles the solver, assembles the deployable module, tests it, runs it
# under a real nginx, and audits the workflows. Called by ci.yml on every push
# and by release.yml before publishing, so both use exactly the same checks.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Compiles the solver, assembles the deployable module and tests both. No
  # binary is committed, so this is the only place dist/ comes from.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - name: install clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: toolchain
        run: |
          clang --version | head -1
          wasm-ld --version || true
          node --version
          clang --print-targets | grep -i wasm || true
      # Split so the job metadata names the stage that failed, without
      # needing the log.
      - name: compile and assemble
        run: ./build.sh --no-test
      - name: no compiler warnings
        run: ./build.sh --strict --no-test
      - name: the documents name a way to get the module that exists
        run: |
          # dist/ is not committed, so both documents must name the build.
          # Pointing at a release is correct only while one exists, so the
          # count decides rather than the phrase being banned outright.
          for f in README.md docs/installation.md; do
            grep -q './build.sh' "$f" || { echo "$f does not name ./build.sh"; exit 1; }
          done
          count=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
                    --json tagName --jq 'length')
          if [ "$count" -eq 0 ]; then
            for f in README.md docs/installation.md; do
              if grep -qi 'download it from a release' "$f"; then
                echo "$f offers a release download and none is published:"
                grep -ni 'download it from a release' "$f"; exit 1
              fi
            done
            echo "ok: no release published, and neither document offers one"
          else
            echo "ok: $count release(s) published, both documents name the build"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: solver suite
        run: node test/solver.test.mjs
      - name: module suite
        run: node test/module.test.mjs
      - name: module input fuzzing
        run: node test/module-fuzz.mjs dist/antibot.js 100000 $RANDOM
      - name: release guards
        # They run once per release, so they are checked on every push.
        run: ./test/release/check.sh
      - name: npm test
        # docs/development.md gives this as the way to run the suites, so a run
        # exercises it rather than only the steps above.
        run: npm test
      - name: record what was built
        run: sha256sum dist/pow_solver.wasm dist/antibot.js
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: antibot
          path: |
            dist/antibot.js
            dist/pow_solver.wasm
          if-no-files-found: error

  mutants:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: antibot
          path: dist
      # Grades the suites rather than the module: each defect names the suite
      # that has to notice it. Its own job because it runs a suite per
      # mutation and takes minutes.
      - name: mutation list
        run: node test/mutants.mjs

  # Loads the built module in njs under a real nginx. This is the only lane
  # where the module runs in njs rather than node, so it is what catches a
  # construct njs does not support.
  example:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: antibot
          path: dist
      - name: install nginx and the njs module
        run: sudo apt-get update && sudo apt-get install -y nginx libnginx-mod-http-js
      - name: shellcheck
        run: shellcheck test/nginx/check.sh test/native/check.sh test/release/check.sh test/release/guards.sh build.sh
      # The whole lane is a script, so it runs on a developer's machine the
      # way test/native/check.sh does. It writes its config, certificate and
      # module under a temporary prefix and needs no privilege.
      - name: run the module under nginx
        run: ./test/nginx/check.sh dist/antibot.js 8443

  # Compiles the solver natively through a shim for the wasm SIMD header and
  # checks every answer against OpenSSL's SHA-256, under AddressSanitizer,
  # UndefinedBehaviorSanitizer, libFuzzer and valgrind.
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: install clang, libssl-dev and valgrind
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev valgrind
      # Coverage accumulates only if the corpus outlives the run.
      - uses: actions/cache@v6.1.0
        with:
          path: test/native/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: sanitizers, libFuzzer and valgrind
        run: ./test/native/check.sh 120 test/native/corpus

  # Audits the workflows and the Dependabot config, and checks that
  # .github/workflows/actions.lock records the commit of every action they
  # use, including the actions those call.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONS_LOCK_VERSION: v0.4.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Fails on any finding and prints the findings to the log.
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          advanced-security: false
      # The extension is a binary from an immutable release. verify-asset
      # checks it against the attestation GitHub signed for that release.
      - name: install gh-actions-lock
        run: |
          gh extension install github/gh-actions-lock --pin "$ACTIONS_LOCK_VERSION"
          gh release verify-asset "$ACTIONS_LOCK_VERSION" \
            "${XDG_DATA_HOME:-$HOME/.local/share}/gh/extensions/gh-actions-lock/gh-actions-lock" \
            --repo github/gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
      # Fails when the lockfile disagrees with a uses: line or a locked commit
      # no longer verifies upstream.
      - name: the lockfile matches the workflows
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
      # Dependabot does not update a gh extension. This step warns when a
      # release newer than ACTIONS_LOCK_VERSION has passed the cooldown
      # dependabot.yml sets for the actions.
      - name: gh-actions-lock is current
        run: |
          days=$(sed -n 's/^ *default-days: *\([0-9][0-9]*\)$/\1/p' .github/dependabot.yml)
          [ -n "$days" ] || { echo "no default-days in .github/dependabot.yml"; exit 1; }
          eligible=$(gh release list --repo github/gh-actions-lock \
                       --exclude-drafts --exclude-pre-releases --limit 50 \
                       --json tagName,publishedAt \
                       --jq "[.[] | select(now - (.publishedAt | fromdateiso8601) >= $days * 86400)][0].tagName // empty")
          [ -n "$eligible" ] || { echo "no gh-actions-lock release is $days days old"; exit 1; }
          newest=$(printf '%s\n' "$ACTIONS_LOCK_VERSION" "$eligible" | sort -V | tail -1)
          if [ "$newest" != "$ACTIONS_LOCK_VERSION" ]; then
            echo "::warning::gh-actions-lock $eligible is out at least $days days; build.yml pins $ACTIONS_LOCK_VERSION"
          else
            echo "ok: pinned $ACTIONS_LOCK_VERSION, newest release out at least $days days is $eligible"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
