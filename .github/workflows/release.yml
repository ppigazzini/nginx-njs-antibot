name: release

# Manual release, from main only. Builds, tests and runs the module under
# nginx, signs build provenance for antibot.js, then attaches it. antibot.js
# is the only file a server needs.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true

permissions:
  contents: read

# Releases run one at a time, and a started one is never cancelled: a publish
# cancelled after its tag push leaves a tag with no release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: $/.github/workflows/build.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # push the tag and create the release
      id-token: write     # request the Sigstore signing certificate
      attestations: write # store the attestation with GitHub
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: antibot
          path: dist
      - name: refuse a release that disagrees
        id: guards
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment, never interpolated into the
          # script, so a crafted input cannot become shell.
          INPUT_TAG: ${{ inputs.tag }}
          BUILT_SHA256: ${{ needs.verify.outputs.antibot-sha256 }}
        run: |
          . ./test/release/guards.sh
          release_check_ref "$GITHUB_REF"
          release_check_tag_shape "$INPUT_TAG"
          release_check_digest "$BUILT_SHA256" \
            "$(sha256sum dist/antibot.js | cut -d' ' -f1)"

          # gh api writes its error body to stdout, so a tag that does not
          # exist yields text rather than nothing. Existence is the exit
          # status of the refs endpoint; the commit is resolved only after.
          existing=""
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$INPUT_TAG" \
               >/dev/null 2>&1; then
            existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/$INPUT_TAG" --jq .sha)
          fi
          release_check_tag_target "$INPUT_TAG" "$existing" "$GITHUB_SHA"

          built=$(sed -n 's/^const ANTIBOT_VERSION = "\(.*\)";$/\1/p' dist/antibot.js)
          release_check_version "$INPUT_TAG" "$built"

          echo "existing=$existing" >> "$GITHUB_OUTPUT"
      # Signs SLSA build provenance for the file with a short-lived Sigstore
      # certificate issued to this workflow run, and stores the attestation
      # with GitHub.
      - uses: actions/attest@v4.2.2
        with:
          subject-path: dist/antibot.js
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          EXISTING: ${{ steps.guards.outputs.existing }}
        run: |
          # The command docs/installation.md gives: the certificate names this
          # workflow on main exactly. A file whose attestation does not verify
          # is not published.
          gh attestation verify dist/antibot.js \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
            --deny-self-hosted-runners

          sum=$(sha256sum dist/antibot.js | cut -d' ' -f1)

          # The tag is created before the release is made, on the commit this
          # run tested. Creating the release with --target instead names a
          # commit by hash, and a push that lands while the run is in flight
          # can leave that commit on no branch, which GitHub refuses with 403.
          # A tag is a ref, so the commit stays reachable and the release is
          # made against something that exists. The API creates it with the
          # job's token, so checkout keeps no credential.
          if [ -z "$EXISTING" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$INPUT_TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi

          gh release create "$INPUT_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$INPUT_TAG" \
            --notes "sha256  $sum" \
            dist/antibot.js
