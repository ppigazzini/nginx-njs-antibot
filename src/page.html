<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Checking your browser</title>
<style>:root{color-scheme:light dark;--bg:#f5f5f5;--fg:#1f2937;--muted:#4b5563;--ring:#d1d5db;--accent:#111827}@media (prefers-color-scheme: dark){:root{--bg:#111827;--fg:#f9fafb;--muted:#d1d5db;--ring:#4b5563;--accent:#f9fafb}}html{background:var(--bg)}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:40px;box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;background:var(--bg);color:var(--fg)}main{max-width:28rem}h1{margin:0 0 12px;font-size:1.5rem;line-height:1.2;color:var(--fg)}p{margin:0 0 20px;color:var(--muted)}.spinner{display:inline-block;width:40px;height:40px;border:4px solid var(--ring);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}noscript p{margin-top:20px}#err{color:#b91c1c;margin-top:20px}#pct{font-variant-numeric:tabular-nums;color:var(--muted);margin-top:16px;min-height:1.2em}@keyframes spin{to{transform:rotate(360deg)}}</style>
</head><body>
<main>
__ANTIBOT_HEADING__<p>Verifying you are not a bot&hellip;</p>
<div class="spinner" aria-hidden="true"></div>
<div id="pct" role="status" aria-live="polite"></div>
<noscript><p><b>JavaScript is required.</b> Enable it and reload the page.</p></noscript>
<p id="err" hidden>Verification failed. Please reload the page.</p>
<script>
(function(){
  var challenge="__ANTIBOT_CHALLENGE__",bits=__ANTIBOT_BITS__;
  var slot="__ANTIBOT_SLOT__",cap=__ANTIBOT_CAP__;
  var expected=__ANTIBOT_EXPECTED__;
  var pctEl=document.getElementById("pct");
  function finish(nonce){
    var v="__ANTIBOT_COOKIE_NAME__="+slot+"."+nonce;
    try{
      document.cookie=v+";Path=/;Max-Age=__ANTIBOT_COOKIE_TTL__;SameSite=Lax;Secure";
      if(String(document.cookie).indexOf(v)===-1){fail();return;}
    }catch(err){fail();return;}
    setTimeout(function(){location.reload();},50);
  }
  function fail(){
    var e=document.getElementById("err");if(e){e.hidden=false;}
    if(pctEl){pctEl.textContent="";}
  }
  if(!(window.Worker&&window.Blob&&window.URL&&window.URL.createObjectURL)){fail();return;}
  function dec(s){var b=atob(s),u=new Uint8Array(b.length),j;
    for(j=0;j<b.length;j++){u[j]=b.charCodeAt(j);}return u;}
  var simd="__ANTIBOT_WASM_B64__";
  var lanes=Math.max(1,Math.min(8,Math.floor((navigator.hardwareConcurrency||2)/2)));
  var src="__ANTIBOT_WORKER_SRC__";
  var url,workers=[],progress=[],dead=0,over=false;
  try{url=URL.createObjectURL(new Blob([src],{type:"text/javascript"}));}
  catch(err){fail();return;}
  function stopAll(){
    for(var j=0;j<workers.length;j++){try{workers[j].terminate();}catch(err){}}
    try{URL.revokeObjectURL(url);}catch(err){}
  }
  function won(nonce){if(over){return;}over=true;stopAll();finish(nonce);}
  function lost(){if(over){return;}dead++;
    if(dead>=workers.length){over=true;stopAll();fail();}}
  function render(){
    if(!pctEl){return;}
    var t=0,j;for(j=0;j<progress.length;j++){t+=progress[j];}
    pctEl.textContent=Math.min(99,Math.round((1-Math.exp(-t/expected))*100))+"%";
  }
  function start(mod){
    var j;
    for(j=0;j<lanes;j++){
      var wk;
      try{wk=new Worker(url);}catch(err){break;}
      progress.push(0);
      wk.onerror=function(){lost();};
      wk.onmessage=(function(idx){return function(ev){
        if(ev.data.n!==undefined){won(ev.data.n);return;}
        if(ev.data.f){lost();return;}
        if(ev.data.p!==undefined){progress[idx]=ev.data.p;render();}
      };})(j);
      workers.push(wk);
    }
    if(workers.length===0){fail();return;}
    for(j=0;j<workers.length;j++){
      workers[j].postMessage({c:challenge,b:bits,m:cap,mod:mod,l:j,k:workers.length});
    }
  }
  if(window.WebAssembly&&window.WebAssembly.compile){
    WebAssembly.compile(dec(simd)).then(start).catch(function(){start(null);});
  }else{start(null);}
})();
</script>
</main>
</body></html>
